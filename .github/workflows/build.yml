name: Build .ankiaddon

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag and release to create (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package add-on
        run: zip mistral_deck_generator.ankiaddon __init__.py config.json config.md manifest.json

      - name: Create release and attach file
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: gh release create "$TAG" mistral_deck_generator.ankiaddon --title "$TAG" --generate-notes

      - name: Attach file to existing release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mistral_deck_generator.ankiaddon --clobber
