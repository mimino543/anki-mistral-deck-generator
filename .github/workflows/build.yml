name: Build .ankiaddon

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package add-on
        run: zip mistral_deck_generator.ankiaddon __init__.py config.json config.md

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mistral_deck_generator.ankiaddon --clobber

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mistral_deck_generator.ankiaddon
          path: mistral_deck_generator.ankiaddon
